strictDepBuilds: true
blockExoticSubdeps: true

catalogs:
  dev:
    publint: 0.3.21
    tsdown: 0.22.1
    typescript: 6.0.3
    oxfmt: 0.52.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    zod: 4.6.7
    vitest: 5.1.0

  types:
    "@types/node": 24.12.4
minimumReleaseAgeExclude:
