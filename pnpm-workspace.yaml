    oxfmt: 0.77.0
    oxlint: 1.92.0
    oxlint-tsgolint: 7.0.2007
    zod: 4.6.7
    vitest: 5.1.0

  types:
    "@types/node": 26.6.6
minimumReleaseAgeExclude:
